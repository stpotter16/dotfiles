# Better command prefix
unbind C-a
set-option -g prefix C-j
bind-key C-j send-prefix

# Better window splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reloads
bind r source-file ~/.tmux.conf

# Don't rename my windows!
set-option -g allow-rename off

# Vim panel motions
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Hub and spoke motion of sessions
bind -r ^ switch-client -l

# Open planning doc
bind -r g neww "nvim +$(grep -n $(date | cut -d ' ' -f1) $HOME/personal/plans/week.md | cut -d : -f1) $HOME/personal/plans/week.md"

# Priorities
bind -r i run-shell "tmux-sessionizer ~/personal/plans/"
bind -r m run-shell "tmux-sessionizer ~/work/hen-trader-portal-api"
bind -r u run-shell "tmux-sessionizer ~/work/hen-trader-common-artifacts"
